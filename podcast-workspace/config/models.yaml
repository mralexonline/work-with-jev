# Model registry. One entry per selectable component.
#
# status (be strict; the UI shows this verbatim):
#   working              exercised end-to-end in this repo's tests on real inputs
#   implemented-untested code path exists but has never run against the real service/model
#   placeholder          stub that raises NotConfigured; shows where an adapter plugs in
#   candidate            researched and listed; no adapter code yet
#   blocked              licence does not permit commercial use; disabled unless you override
# license.class: permissive | open-weight-restricted (use-based/custom terms) | non-commercial
# License and size facts were read from the Hugging Face API on `verified_on`
# (https://huggingface.co/api/models/<repo>); re-check before commercial use. Revisions are
# the commit SHAs seen on that date; installs pin to them so a later upstream change cannot
# silently alter what runs.
verified_on: 2026-10-05
models:
  # ---------------------------------------------------------------- LLM (script + scene plan)
  - id: template-local
    kind: llm
    name: Built-in template writer (no model)
    runs_on: local
    adapter: app.adapters.llm:TemplateLLM
    status: working
    license: {name: this repo, class: permissive}
    notes: Deterministic placeholder dialogue so the zero-credential 30 s proof runs. NOT an LLM; refused above 60 s.
  - id: openai-compatible
    kind: llm
    name: Any OpenAI-compatible chat endpoint (vLLM, Ollama, OpenRouter, OpenAI...)
    runs_on: external-api
    adapter: app.adapters.llm:OpenAICompatLLM
    status: implemented-untested
    license: {name: depends on the model you point it at, class: open-weight-restricted}
    needs: [LLM_BASE_URL, LLM_MODEL, LLM_API_KEY]
    notes: Tested only against a local mock server. Prompt/response content leaves this host.
  - id: anthropic-api
    kind: llm
    name: Anthropic Messages API
    runs_on: external-api
    adapter: app.adapters.llm:AnthropicLLM
    status: implemented-untested
    license: {name: Anthropic commercial API terms (not open source), class: open-weight-restricted}
    needs: [ANTHROPIC_API_KEY, LLM_MODEL]
    notes: Tested only against a local mock server. Not open-weight; listed because script quality matters most for a 20-minute episode.
  - id: qwen3-30b-a3b-instruct-2507
    kind: llm
    name: Qwen3-30B-A3B-Instruct-2507 (self-hosted behind an OpenAI-compatible server)
    runs_on: modal
    source: {type: huggingface, repo: Qwen/Qwen3-30B-A3B-Instruct-2507, revision: 0d7cf23991f47feeb3a57ecb4c9cee8ea4a17bfe}
    license: {name: Apache-2.0, class: permissive, commercial_use: true}
    hardware: {weights_gb: 61.1, min_vram_gb: 70, suggested_gpu: H100}
    status: candidate
    notes: Cheaper to call a hosted API for one script per episode than to keep this on a GPU.

