      - {url: "https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin", path: voices-v1.0.bin, sha256: "bca610b8308e8d99f32e6fe4197e7ec01679264efed0cac9140fe9c29f1fbf7d"}
    license: {name: Apache-2.0, class: permissive, commercial_use: true}
    hardware: {weights_gb: 0.12, min_vram_gb: 0, suggested_gpu: none}
    status: working
    notes: Fast and clearly synthetic-but-pleasant. Fixed voice pack (no cloning). Used for the free proof.
  - id: chatterbox
